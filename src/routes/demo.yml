diagramNodes:
  - id: myfirstnode
    nodeKind: myInputDiscard
    pos:
      x: 0
      y: 0
  - id: mydiscard
    nodeKind: myDiscard
    pos:
      x: 2
      y: 0
# It is often easier to write links next to its corresponding node, but it is easier to program
# this way so let's start easy and then add more fancy syntax.
diagramLinks:
  - from: myfirstnode
    to: mysecondnode
viewport:
  x: 0
  y: 0
  w: 20
  h: 20
availableNodes:
  - nodeKind: myDiscard
    svgName: cryptodiagDiscard
  - nodeKind: myInputDiscard
    svgName: cryptodiagInputDiscard
            
